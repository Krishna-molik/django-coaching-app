{% extends "Base.html" %}
{% block title %}
Delete Review
{% endblock %}
{% block content %}
<div class="border border-warning p-4 mt-5">
    <h3 class="text-center ">Do you want to delete this Review ?</h3>
    <form method="POST" class="form text-center mt-2">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Yes</button>
        <a href="{% url 'reviews' %}" class="btn btn-success">Cancel</a>
    </form>
</div>
{% endblock %}

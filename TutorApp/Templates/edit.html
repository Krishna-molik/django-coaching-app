{% extends "Base.html" %}
{% block title %}
Edit Review
{% endblock %}
{% block content %}
<div class="text-center">
    <h1 class="mb-2 mt-3">Edit Form</h1>
    <form method="POST" class="form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Submit</button>
        <a href="{% url 'reviews' %}" class="btn btn-primary">Cancel</a>
    </form>
</div>
{% endblock %}

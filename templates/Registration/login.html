{% extends "Base.html" %}

{% block title %}
	Login
{% endblock  %}

{% block content %}
<h2>Login Form</h2>
	<form class="form" method="POST">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit" class="btn btn-primary">Login</button>
	</form>
	<p>Don't have an account <a href="{% url 'register' %}">Click here</a> to register.</p>
{% endblock  %}
